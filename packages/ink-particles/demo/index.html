<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<title>ink-particles demo</title>
<style>
  html,body{margin:0;height:100%;background:#1a1512;}
  #stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{width:540px;height:960px;display:block;box-shadow:0 0 60px rgba(0,0,0,.6);}
  #hud{position:fixed;left:12px;bottom:12px;color:#cfc2ae;font:13px/1.6 ui-monospace,monospace;
       background:rgba(0,0,0,.45);padding:8px 10px;border-radius:6px;}
  #hud b{color:#f0e4cf;}
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>
<div id="hud">t = <b id="t">0.00</b>s　|　空格暂停　|　← → 步进 0.1s</div>
<script type="module">
import { InkParticles } from '../src/ink-particles.js';

const cv = document.getElementById('cv');
const p = new InkParticles(cv, {
  count: 120000,
  ink: 'ink-dot.png',
  paper: 'paper.png',
  size: 0.026,
  spread: 0.55,
  flow: 0.9,
  curl: 2.2,
  alpha: 0.85,
});
await p.ready;

// 演示：给一条"笔迹"（一个人影的轮廓），粒子沿它分布
function personPath() {
  const P = [];
  const cx = 0.5;
  // 头
  for (let i = 0; i <= 40; i++) {
    const a = Math.PI * (-0.1 + 1.2 * (i / 40));
    P.push([cx + Math.cos(a) * 0.10, 0.30 + Math.sin(a) * 0.10]);
  }
  // 右肩 → 右袖 → 下垂的手
  P.push([cx + 0.13, 0.44], [cx + 0.22, 0.50], [cx + 0.26, 0.62], [cx + 0.24, 0.74]);
  // 右手回到身体右侧 → 袍摆
  P.push([cx + 0.14, 0.80], [cx + 0.20, 0.90], [cx + 0.10, 0.96]);
  // 左摆 → 左袖
  P.push([cx - 0.10, 0.96], [cx - 0.20, 0.90], [cx - 0.14, 0.80]);
  P.push([cx - 0.24, 0.74], [cx - 0.26, 0.62], [cx - 0.22, 0.50], [cx - 0.13, 0.44]);
  return P;
}

if (new URLSearchParams(location.search).get('path') !== '0') {
  p.setPath(personPath(), 0.028);
  p.set({ alpha: 0.9, size: 0.020, curl: 1.1 });
}

let t = 0, playing = true, last = performance.now();
const tEl = document.getElementById('t');

function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (playing) t += dt;
  p.setTime(t).render();
  tEl.textContent = t.toFixed(2);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

addEventListener('keydown', e => {
  if (e.code === 'Space') { playing = !playing; e.preventDefault(); }
  if (e.code === 'ArrowRight') { playing = false; t += 0.1; }
  if (e.code === 'ArrowLeft') { playing = false; t = Math.max(0, t - 0.1); }
});

// 给逐帧抓取用：同一 t 必然同一帧
window.__frame = (sec) => { playing = false; t = sec; p.setTime(sec).render(); return sec; };
window.__ready = true;
</script>
</body>
</html>
